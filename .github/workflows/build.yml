name: build-docker
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate docker-compose.yml
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.colocated.yml config -q

      - name: Validate Caddyfiles
        run: |
          for f in Caddyfile Caddyfile.colocated; do
            docker run --rm -e SERVER_DOMAIN=example.org -e CLIENT_ID=x -v $PWD/caddy:/etc/caddy:ro caddy:2.10.2 \
              caddy validate --config /etc/caddy/$f --adapter caddyfile
          done

      - name: Build images
        run: docker compose build

  mediaserver-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # go vet + go test against the real vips/ffmpeg/file binaries (the Dockerfile's test stage)
      - name: Go tests
        run: docker build -f mediaserver/Dockerfile --target test .
