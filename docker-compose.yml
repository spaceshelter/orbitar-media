version: '3.9'

services:
  caddy:
    image: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN}
      CLIENT_ID: ${CLIENT_ID}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/media.caddy:/etc/caddy/media.caddy:ro
      - ./caddy/static:/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mediaserver
    # Default caddy command borrowed from https://github.com/caddyserver/caddy-docker/blob/master/Dockerfile.tmpl
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]

  # Serves everything behind Caddy (mediaserver/README.md)
  mediaserver:
    build:
      context: .
      dockerfile: mediaserver/Dockerfile
    restart: unless-stopped
    environment:
      HASH_DIMS_AES_KEY: ${HASH_DIMS_AES_KEY}
      CLIENT_ID: ${CLIENT_ID}
      CONTENTCONTROLLERS: "IMAGE,VIDEO"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-50}
      # MEDIASERVER_* overrides go on the command line, not in .env: the deploy refuses a
      # .env whose keys differ from .env.sample
      MAX_CONCURRENT_VIDEO_HANDLERS: ${MAX_CONCURRENT_VIDEO_HANDLERS:-2}
      MAX_CONCURRENT_IMAGE_HANDLERS: ${MEDIASERVER_IMAGE_HANDLERS:-2}
      FFMPEG_MEMORY_LIMIT_MB: ${FFMPEG_MEMORY_LIMIT_MB:-2560}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      COUB_PROXY_URL: ${COUB_PROXY_URL:-}
      READ_ONLY: ${MEDIASERVER_READ_ONLY:-0}
      TOUCH_ON_ACCESS_MINUTES: ${MEDIASERVER_TOUCH_ON_ACCESS_MINUTES:-0}
    volumes:
      - pictshare_data:/var/www/data

  cleanup:
    build:
      context: cleanup-service
    restart: unless-stopped
    environment:
      REQUIRED_SPACE: ${REQUIRED_SPACE:-10}
    volumes:
      - pictshare_data:/var/lib/orbitar_media_data

volumes:
  caddy_data:
  caddy_config:
  pictshare_data:  # historical name, kept so existing deployments keep their volume
    driver: local
    driver_opts:
        type: none
        o: bind
        device: ${DATA_DIR}
