version: '3.9'

services:
  caddy:
    image: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN}
      CLIENT_ID: ${CLIENT_ID}
      BACKEND: ${BACKEND:-php}  # php or go: the service (network alias) that gets the traffic, see media.caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/media.caddy:/etc/caddy/media.caddy:ro
      - ./caddy/static:/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pictshare
      - mediaserver
    # Default caddy command borrowed from https://github.com/caddyserver/caddy-docker/blob/master/Dockerfile.tmpl
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]

  pictshare:
    build:
      context: pictshare
    restart: unless-stopped
    environment:
      HASH_DIMS_AES_KEY: ${HASH_DIMS_AES_KEY}
      CLIENT_ID: ${CLIENT_ID}  # geturl.php checks it itself too
      CONTENTCONTROLLERS: "IMAGE,VIDEO"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-50}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256}  # PHP 8.4 GD needs a second full-size buffer for large PNG decode / WebP encode
      MAX_CONCURRENT_VIDEO_HANDLERS: ${MAX_CONCURRENT_VIDEO_HANDLERS:-4}
      FFMPEG_MEMORY_LIMIT_MB: ${FFMPEG_MEMORY_LIMIT_MB:-2560}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      COUB_PROXY_URL: ${COUB_PROXY_URL:-}
    volumes:
      - pictshare_data:/var/www/data
    networks:
      default:
        aliases: [php]

  # Go replacement for pictshare (mediaserver/README.md). Both always run on the same data volume;
  # BACKEND in .env picks the one Caddy sends traffic to, the other one idles.
  mediaserver:
    build:
      context: .
      dockerfile: mediaserver/Dockerfile
    restart: unless-stopped
    environment:
      HASH_DIMS_AES_KEY: ${HASH_DIMS_AES_KEY}
      CLIENT_ID: ${CLIENT_ID}
      CONTENTCONTROLLERS: "IMAGE,VIDEO"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-50}
      # MEDIASERVER_* overrides go on the command line, not in .env: the deploy refuses a
      # .env whose keys differ from .env.sample
      MAX_CONCURRENT_VIDEO_HANDLERS: ${MAX_CONCURRENT_VIDEO_HANDLERS:-4}
      MAX_CONCURRENT_IMAGE_HANDLERS: ${MEDIASERVER_IMAGE_HANDLERS:-2}
      FFMPEG_MEMORY_LIMIT_MB: ${FFMPEG_MEMORY_LIMIT_MB:-2560}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      COUB_PROXY_URL: ${COUB_PROXY_URL:-}
      READ_ONLY: ${MEDIASERVER_READ_ONLY:-0}
      TOUCH_ON_ACCESS_MINUTES: ${MEDIASERVER_TOUCH_ON_ACCESS_MINUTES:-0}
    volumes:
      - pictshare_data:/var/www/data
    networks:
      default:
        aliases: [go]

  cleanup:
    build:
      context: cleanup-service
    restart: unless-stopped
    environment:
      REQUIRED_SPACE: ${REQUIRED_SPACE:-10}
    volumes:
      - pictshare_data:/var/lib/orbitar_media_data

volumes:
  caddy_data:
  caddy_config:
  pictshare_data:
    driver: local
    driver_opts:
        type: none
        o: bind
        device: ${DATA_DIR}
